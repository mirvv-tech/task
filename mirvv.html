<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة وتحليل نتائج الطلاب</title>
</head>
<body>
  <h2>نظام إدارة وتحليل نتائج الطلاب</h2>
  <p>افتح الـ Console لمشاهدة المخرجات (اضغط F12 ثم تبويب Console).</p>

  <script>

    // 1) هيكلة بيانات الطالب (Class & Constructor)

    class Student {
      constructor(id, name, grades, attendance) {
        this.id = id;                 // رقم الجلوس
        this.name = name;             // الاسم
        this.grades = grades;         // مصفوفة درجات 3 مواد
        this.attendance = attendance; // نسبة الحضور
      }

      // 2) دوال التحليل الأكاديمي (Methods)

      // حساب المتوسط باستخدام reduce
      calculateAverage() {
        const total = this.grades.reduce((sum, grade) => sum + grade, 0);
        return total / this.grades.length;
      }

      // التقدير بالحروف (يستقبل المتوسط)
      getGrade(average) {
        if (average >= 90) {
          return "A";
        } else if (average >= 80) {
          return "B";
        } else if (average >= 70) {
          return "C";
        } else if (average >= 60) {
          return "D";
        } else if (average >= 50) {
          return "E";
        } else {
          return "F";
        }
      }

      // النتيجة النهائية: متوسط >= 50 && حضور >= 75

      getFinalResult() {
        const average = this.calculateAverage();
        if (average >= 50 && this.attendance >= 75) {
          return "ناجح";
        }
        return "يحتاج مراجعة";
      }
    }

    // 3) نظام تشغيل الجامعة (Objects Array)

    const studentsList = [
      new Student(101, "أحمد علي",   [85, 78, 90], 92), // متوسط ≈ 84.33 (ناجح)
      new Student(102, "سارة محمود", [45, 48, 42], 80), // متوسط = 45    (متعثرة)
      new Student(103, "عمر خالد",   [40, 50, 48], 85), // متوسط = 46    (متعثر)
      new Student(104, "منى حسن",    [65, 58, 62], 60)  // متوسط ≈ 61.67 لكن الحضور ضعيف
    ];

    // 5-أ) تقرير لكل طالب في المصفوفة الرئيسية

    console.log("===== تقرير نتائج الطلاب =====");
    studentsList.forEach((student) => {
      const avg = student.calculateAverage();
      console.log(
        `الاسم: ${student.name} | المتوسط: ${avg.toFixed(2)} | ` +
        `التقدير: ${student.getGrade(avg)} | النتيجة: ${student.getFinalResult()}`
      );
    });

    // 4) لجنة الرأفة (Array Methods)

    // الاستخراج: filter للطلاب الذين متوسطهم بين 40 و 49
    const strugglingStudents = studentsList.filter((student) => {
      const avg = student.calculateAverage();
      return avg >= 40 && avg <= 49;
    });

    // المعالجة: map لإضافة 5 درجات رأفة للمتوسط
    // (نُرجع كائنات جديدة حتى لا نعدل على بيانات الطلاب الأصلية)

    const leniencyResults = strugglingStudents.map((student) => {
      const oldAverage = student.calculateAverage();
      return {
        id: student.id,
        name: student.name,
        oldAverage: oldAverage,
        newAverage: oldAverage + 5
      };
    });

    // التحليل: reduce لجمع المتوسطات الجديدة بعد التعديل

    const totalNewAverages = leniencyResults.reduce(
      (sum, student) => sum + student.newAverage,
      0
    );

    // متوسط الرأفة مع درع الحماية من القسمة على صفر

    const leniencyAverage =
      leniencyResults.length === 0
        ? 0
        : totalNewAverages / leniencyResults.length;

    // 5-ب / 5-ج) باقي المخرجات

    console.log("===== الطلاب المتعثرون الذين شملتهم الرأفة =====");
    console.log(leniencyResults);

    console.log("===== متوسط درجات الطلاب المتعثرين بعد التعديل =====");
    console.log(leniencyAverage.toFixed(2));
  </script>
</body>
</html>
